plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.evaluate'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0-M6")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    //implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    //implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    //implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'

    implementation 'com.julien-dubois.bootui:bootui-spring-boot-starter:1.1.0'

    implementation 'dev.langchain4j:langchain4j-agentic:1.15.0-beta25'
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini:1.14.1'
    implementation 'dev.langchain4j:langchain4j-ollama:1.15.0'
    implementation 'dev.langchain4j:langchain4j-web-search-engine-tavily:1.15.0-beta25'
    //implementation 'dev.langchain4j:langchain4j-easy-rag:1.15.0-beta25'
    implementation 'dev.langchain4j:langchain4j-document-parser-apache-tika:1.14.1-beta24'
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.14.1-beta24'
    implementation 'dev.langchain4j:langchain4j-pgvector:1.14.1-beta24'
    //implementation 'dev.langchain4j:langchain4j-experimental-sql:1.15.0-beta25'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
